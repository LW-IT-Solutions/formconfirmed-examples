name: formconfirmed availability
run-name: ${{ inputs.environment == 'dev' && 'Development availability' || 'Production availability' }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to verify
        type: choice
        options:
          - prod
          - dev
        default: prod
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'

permissions:
  contents: read

concurrency:
  group: formconfirmed-availability
  cancel-in-progress: false

jobs:
  availability:
    if: github.event_name == 'workflow_dispatch' || vars.FC_MONITOR_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Check the public widget, API and AI
        id: check
        env:
          FC_MONITOR_BASE_URL: ${{ inputs.environment == 'dev' && 'https://dev.formconfirmed.com' || 'https://formconfirmed.com' }}
          FC_MONITOR_SECRET: ${{ inputs.environment == 'dev' && secrets.FC_MONITOR_SECRET_DEV || secrets.FC_MONITOR_SECRET }}
        run: node .github/scripts/availability.cjs
      # Incident alerts are recorded by the Pi watchdog in Admin -> Urgent Logs.
      # Do not create issues or send email notifications from this monitor.
